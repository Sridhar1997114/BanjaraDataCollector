<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banjara Voice Collector v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: 20px;
        }

        body {
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 2rem 0;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 680px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .ambient-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            filter: blur(80px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .glow-1 {
            top: -100px;
            left: -100px;
        }

        .glow-2 {
            bottom: -100px;
            right: -100px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #fff;
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .word-display {
            margin-bottom: 1.5rem;
            transition: transform 0.3s, opacity 0.3s;
        }

        .banjara-text {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .english-text {
            font-size: 1.15rem;
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
            font-weight: 300;
        }

        .example-sentence {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            text-align: left;
        }

        .example-sentence .label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 0.35rem;
        }

        .example-sentence .sentence {
            font-style: italic;
        }

        .section-divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin: 1rem 0;
        }

        .rec-section {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .rec-section .rec-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.4);
            min-width: 80px;
            text-align: left;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.75rem;
            padding: 0.65rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            color: #fff;
        }

        .btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #fff;
            color: #000;
            border: none;
        }

        .btn-primary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
        }

        .btn-sm {
            padding: 0.5rem 0.75rem;
            font-size: 0.75rem;
        }

        .btn-rec {
            flex: 1;
        }

        .btn-play {
            min-width: 40px;
            padding: 0.5rem;
        }

        .btn-recording {
            background: rgba(255, 68, 68, 0.15) !important;
            border-color: rgba(255, 68, 68, 0.4) !important;
            color: #ff4444 !important;
        }

        .btn-done {
            border-color: rgba(100, 255, 100, 0.3) !important;
        }

        .recording-indicator {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #ff4444;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .recording-indicator.active {
            opacity: 1;
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        .recording-dot {
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 0.5rem;
        }

        .notes-area {
            width: 100%;
            min-height: 70px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.75rem;
            color: #fff;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
            margin-top: 0.25rem;
        }

        .notes-area:focus {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .notes-area::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .fade-out {
            opacity: 0;
            transform: translateY(-20px);
        }

        .fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .action-row .btn {
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <main class="glass-card">
        <div id="recordingIndicator" class="recording-indicator">
            <div class="recording-dot"></div>
            REC
        </div>

        <div class="stats">
            <span id="progressPercent">0% COMPLETE</span>
            <span id="wordCount">0/0 WORDS</span>
        </div>
        <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>

        <!-- Word Display -->
        <div id="wordDisplay" class="word-display">
            <div id="banjaraWord" class="banjara-text">Loading...</div>
            <div id="englishMeaning" class="english-text">Please wait</div>
        </div>

        <!-- Example Sentence -->
        <div id="exampleBox" class="example-sentence">
            <div class="label">Example Sentence</div>
            <div id="exampleSentence" class="sentence"></div>
        </div>

        <!-- Record Word -->
        <div class="rec-section">
            <span class="rec-label">Word</span>
            <button id="recWordBtn" class="btn btn-primary btn-sm btn-rec">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                </svg>
                <span id="recWordText">Record Word</span>
            </button>
            <button id="playWordBtn" class="btn btn-sm btn-play" disabled title="Play word">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            </button>
        </div>

        <!-- Record Sentence -->
        <div class="rec-section">
            <span class="rec-label">Sentence</span>
            <button id="recSentBtn" class="btn btn-sm btn-rec" style="background:rgba(255,255,255,0.08);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                </svg>
                <span id="recSentText">Record Sentence</span>
            </button>
            <button id="playSentBtn" class="btn btn-sm btn-play" disabled title="Play sentence">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
            </button>
        </div>

        <hr class="section-divider">

        <!-- Notes -->
        <div style="text-align:left; margin-bottom: 0.25rem;">
            <span class="rec-label" style="min-width:auto;">Notes (word-wise meaning)</span>
        </div>
        <textarea id="notesArea" class="notes-area"
            placeholder="e.g. apan-we, chattameer mundang-in front of law, vatemar rrenu-abide"></textarea>

        <!-- Action Buttons -->
        <div class="action-row">
            <button id="skipBtn" class="btn">Skip Word</button>
            <button id="saveBtn" class="btn" disabled>Save & Next</button>
        </div>

        <div class="mt-6 text-[10px] text-zinc-600 uppercase tracking-widest font-mono">
            Banjara AI • Data Collection Tool v2.1
        </div>

        <!-- Settings Cog -->
        <button id="settingsBtn" class="absolute top-6 left-6 text-zinc-500 hover:text-white transition-colors">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                    d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z">
                </path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-card max-w-md p-8 text-left">
            <h2 class="text-xl font-bold mb-6">GitHub Configuration</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] text-zinc-500 uppercase tracking-widest mb-2 font-mono">Personal
                        Access Token</label>
                    <input type="password" id="ghToken"
                        class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-sm focus:outline-none focus:border-white/30 transition-all"
                        placeholder="ghp_xxxxxxxxxxxx">
                </div>
                <div>
                    <label class="block text-[10px] text-zinc-500 uppercase tracking-widest mb-2 font-mono">Repository
                        (owner/repo)</label>
                    <input type="text" id="ghRepo"
                        class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-sm focus:outline-none focus:border-white/30 transition-all"
                        placeholder="Sridhar1997114/BanjaraDataCollector">
                </div>
                <div class="flex gap-4 mt-8">
                    <button id="closeSettings" class="btn flex-1 py-3 mt-0">Close</button>
                    <button id="saveSettings" class="btn btn-primary flex-1 py-3 mt-0">Save Config</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Data source -->
    <script src="banjara_unique_words_with_english.js"></script>

            const vowels = 'aeiou';

            if (words.length > 2) return `This is about "${englishWord}".`;

            const cap = w.charAt(0).toUpperCase() + w.slice(1);

        }

        // ─── State ───
        let currentIndex = parseInt(localStorage.getItem('banjara_index')) || 0;
        let wordRecorder, sentRecorder;
        let wordBlobs = [], sentBlobs = [];
        let wordAudioBlob = null, sentAudioBlob = null;

        // ─── DOM ───
        const banjaraEl = document.getElementById('banjaraWord');
        const englishEl = document.getElementById('englishMeaning');
        const exampleSentence = document.getElementById('exampleSentence');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const wordCountEl = document.getElementById('wordCount');
        const recWordBtn = document.getElementById('recWordBtn');
        const recWordText = document.getElementById('recWordText');
        const playWordBtn = document.getElementById('playWordBtn');
        const recSentBtn = document.getElementById('recSentBtn');
        const recSentText = document.getElementById('recSentText');
        const playSentBtn = document.getElementById('playSentBtn');
        const saveBtn = document.getElementById('saveBtn');
        const skipBtn = document.getElementById('skipBtn');
        const notesArea = document.getElementById('notesArea');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const wordDisplay = document.getElementById('wordDisplay');

        // ─── UI Update ───
        function updateUI() {
            if (currentIndex >= BANJARA_WORDS.length) {
                banjaraEl.textContent = "Done!";
                englishEl.textContent = "All words recorded.";
                exampleSentence.textContent = "";
                recWordBtn.disabled = true;
                recSentBtn.disabled = true;
                skipBtn.disabled = true;
                return;
            }

            const current = BANJARA_WORDS[currentIndex];
            wordDisplay.classList.add('fade-out');

            setTimeout(() => {
                banjaraEl.textContent = current.banjara;
                englishEl.textContent = current.english;
                exampleSentence.textContent = generateExample(current.english);
                wordDisplay.classList.remove('fade-out');
                wordDisplay.classList.add('fade-in');
            }, 250);

            const progress = (currentIndex / BANJARA_WORDS.length) * 100;
            progressFill.style.width = `${progress}%`;
            progressPercent.textContent = `${Math.round(progress)}% COMPLETE`;
            wordCountEl.textContent = `${currentIndex}/${BANJARA_WORDS.length} WORDS`;

            // Reset state
            playWordBtn.disabled = true;
            playSentBtn.disabled = true;
            saveBtn.disabled = true;
            wordAudioBlob = null;
            sentAudioBlob = null;
            notesArea.value = '';
            recWordText.textContent = 'Record Word';
            recSentText.textContent = 'Record Sentence';
            recWordBtn.classList.remove('btn-recording', 'btn-done');
            recSentBtn.classList.remove('btn-recording', 'btn-done');
            checkSaveReady();
        }

        function checkSaveReady() {
            // Enable save if at least word audio is recorded
            saveBtn.disabled = !wordAudioBlob;
        }

        // ─── Generic Recorder ───
        async function startRec(type) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const recorder = new MediaRecorder(stream);
                const blobs = [];

                recorder.ondataavailable = (e) => blobs.push(e.data);
                recorder.onstop = () => {
                    const blob = new Blob(blobs, { type: 'audio/wav' });
                    if (type === 'word') {
                        wordAudioBlob = blob;
                        playWordBtn.disabled = false;
                        recWordBtn.classList.remove('btn-recording');
                        recWordBtn.classList.add('btn-done');
                        recWordText.textContent = 'Re-record Word';
                    } else {
                        sentAudioBlob = blob;
                        playSentBtn.disabled = false;
                        recSentBtn.classList.remove('btn-recording');
                        recSentBtn.classList.add('btn-done');
                        recSentText.textContent = 'Re-record Sentence';
                    }
                    recordingIndicator.classList.remove('active');
                    checkSaveReady();
                };

                recorder.start();
                recordingIndicator.classList.add('active');

                if (type === 'word') {
                    wordRecorder = recorder;
                    recWordBtn.classList.add('btn-recording');
                    recWordText.textContent = 'Stop';
                } else {
                    sentRecorder = recorder;
                    recSentBtn.classList.add('btn-recording');
                    recSentText.textContent = 'Stop';
                }
            } catch (err) {
                alert("Microphone access denied.");
            }
        }

        function stopRec(type) {
            const rec = type === 'word' ? wordRecorder : sentRecorder;
            if (rec && rec.state === 'recording') {
                rec.stop();
                rec.stream.getTracks().forEach(t => t.stop());
            }
        }

        recWordBtn.onclick = () => {
            if (wordRecorder && wordRecorder.state === 'recording') stopRec('word');
            else startRec('word');
        };

        recSentBtn.onclick = () => {
            if (sentRecorder && sentRecorder.state === 'recording') stopRec('sentence');
            else startRec('sentence');
        };

        playWordBtn.onclick = () => {
            if (wordAudioBlob) new Audio(URL.createObjectURL(wordAudioBlob)).play();
        };

        playSentBtn.onclick = () => {
            if (sentAudioBlob) new Audio(URL.createObjectURL(sentAudioBlob)).play();
        };

        // ─── GitHub Upload ───
        async function uploadToGitHub(blob, path, commitMsg) {
            const token = localStorage.getItem('gh_token');
            const repo = localStorage.getItem('gh_repo');

            if (!token || !repo) {
                // Download locally
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = path.split('/').pop();
                a.click();
                return true;
            }

            try {
                const reader = new FileReader();
                const b64 = await new Promise(resolve => {
                    reader.onloadend = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(blob);
                });

                const url = `https://api.github.com/repos/${repo}/contents/${path}`;
                const resp = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: commitMsg, content: b64, branch: 'main' })
                });

                if (resp.ok) return true;
                const err = await resp.json();
                throw new Error(err.message);
            } catch (err) {
                console.error("Upload Error:", err);
                alert("GitHub Upload Failed: " + err.message);
                return false;
            }
        }

        async function uploadText(text, path, commitMsg) {
            const token = localStorage.getItem('gh_token');
            const repo = localStorage.getItem('gh_repo');
            if (!token || !repo) return true;

            try {
                const content = btoa(unescape(encodeURIComponent(text)));
                const url = `https://api.github.com/repos/${repo}/contents/${path}`;
                const resp = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: commitMsg, content: content, branch: 'main' })
                });
                if (resp.ok) return true;
                const err = await resp.json();
                throw new Error(err.message);
            } catch (err) {
                console.error("Upload Error:", err);
                return false;
            }
        }

        // ─── Save ───
        saveBtn.onclick = async () => {
            if (!wordAudioBlob) return;
            saveBtn.disabled = true;
            saveBtn.textContent = "Saving...";

            const current = BANJARA_WORDS[currentIndex];
            const safeName = current.english.replace(/[^\w\s]/g, '').replace(/\s+/g, '_');

            // 1. Upload word audio
            const wordOk = await uploadToGitHub(wordAudioBlob,
                `audio/${safeName}.wav`,
                `Record word: ${current.english}`);

            // 2. Upload sentence audio (if recorded)
            let sentOk = true;
            if (sentAudioBlob) {
                sentOk = await uploadToGitHub(sentAudioBlob,
                    `audio_sentences/${safeName}.wav`,
                    `Record sentence for: ${current.english}`);
            }

            // 3. Upload notes (if provided)
            let notesOk = true;
            const notes = notesArea.value.trim();
            if (notes) {
                const jsonData = JSON.stringify({
                    banjara: current.banjara,
                    english: current.english,
                    example_sentence: exampleSentence.textContent,
                    notes: notes,
                    has_word_audio: true,
                    has_sentence_audio: !!sentAudioBlob
                }, null, 2);
                notesOk = await uploadText(jsonData,
                    `notes/${safeName}.json`,
                    `Notes for: ${current.english}`);
            }

            if (wordOk && sentOk && notesOk) {
                nextWord();
            }
            saveBtn.textContent = "Save & Next";
            saveBtn.disabled = false;
        };

        // ─── Navigation ───
        skipBtn.onclick = nextWord;

        function nextWord() {
            currentIndex++;
            localStorage.setItem('banjara_index', currentIndex);
            updateUI();
        }

        // ─── Settings ───
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        document.getElementById('closeSettings').onclick = () =>
            settingsModal.classList.add('opacity-0', 'pointer-events-none');

        settingsBtn.onclick = () => {
            document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
            document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
        };

        document.getElementById('saveSettings').onclick = () => {
            localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
            localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
            alert("Settings saved!");
        };

        // ─── Init ───
        if (typeof BANJARA_WORDS !== 'undefined') {
            updateUI();
        } else {
            banjaraEl.textContent = "Error";
            englishEl.textContent = "Could not load dictionary.";
        }
    </script>
