            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { mono: ['JetBrains Mono', 'monospace'], sans: ['Inter', 'sans-serif'] },

    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .stoic-glass {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .fine8-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dash 3s ease-in-out forwards;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: 0;
            }
        }

        .recording-pulse {
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #111;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>

        // ===== CORE LOGIC =====

        function populateBatchSelector() {
            const select = document.getElementById('batchSelector');
            select.innerHTML = '';
            Object.keys(batches).sort((a, b) => a - b).forEach(num => {
                const opt = document.createElement('option');
                opt.value = num;
                opt.textContent = `Batch ${num} (${batches[num].length} sentences)`;
                select.appendChild(opt);
            });
            select.value = currentBatch;
            select.addEventListener('change', (e) => loadBatch(parseInt(e.target.value)));
        }

        function loadBatch(batchNum) {
            currentBatch = batchNum;
            state.sentences = batches[batchNum] || [];
            state.currentIndex = 0;
            state.recordings = [];
            state.sessionStartTime = Date.now();
            updateStats();
            loadSentence();
        }

        function initialize() {
            try {
                populateBatchSelector();
                loadBatch(currentBatch);
                startSessionTimer();
                updateStats();
            } catch (error) {
                console.error('Initialization error:', error);
                alert('Error initializing: ' + error.message);
            }
        }

        function loadSentence() {
            if (state.currentIndex >= state.sentences.length) {
                showCompletionScreen();
                return;
            }

            const item = state.sentences[state.currentIndex];
            const englishText = typeof item === 'string' ? item : item.english;
            const suggestionText = typeof item === 'string' ? '' : (item.suggestion || '');
            const prefilledBanjara = typeof item === 'string' ? '' : (item.banjara || '');

            // Animate Transition
            const display = document.getElementById('englishSentence');
            display.style.opacity = '0';
            setTimeout(() => {
                display.textContent = englishText;
                display.style.opacity = '1';
                display.classList.add('transition-opacity', 'duration-500');
            }, 200);

            // AI Suggestion
            const suggestionBox = document.getElementById('suggestionBox');
            if (suggestionText) {
                suggestionBox.classList.remove('hidden');
                document.getElementById('suggestionText').innerHTML = formatSuggestion(suggestionText);
            } else {
                suggestionBox.classList.add('hidden');
            }

            // Auto Notes
            const autoNotesBox = document.getElementById('autoNotesBox');
            const autoNotes = generateAutoNotes(suggestionText);
            if (autoNotes) {
                autoNotesBox.classList.remove('hidden');
                document.getElementById('autoNotesText').textContent = autoNotes;
                state.autoNotes = autoNotes;
            } else {
                autoNotesBox.classList.add('hidden');
                state.autoNotes = '';
            }

            // Inputs
            const banjaraInput = document.getElementById('banjaraInput');
            banjaraInput.value = prefilledBanjara;
            document.getElementById('notesInput').value = '';
            banjaraInput.focus();

            // Reset Audio
            state.currentAudioBlob = null;
            state.audioChunks = [];

            updateStatus('Ready to record', 'idle');
            updateUI();
            updateProgress();
        }

        function formatSuggestion(text) {
            if (!text) return '';
            return text
                .replace(/❓(\w+)/g, '<span class="text-red-400 font-bold">❓$1</span>')
                .replace(/✅/g, '<span class="text-emerald-400 font-bold">✅</span>')
                .replace(/\[(\d+)%\]/g, '<span class="bg-blue-900/50 text-blue-300 px-1 rounded text-xs font-mono">$1%</span>');
        }

        function generateAutoNotes(suggestion) {
            if (!suggestion) return '';
            const matches = suggestion.match(/([\w]+)\(([^)]+)\)/g);
            if (!matches) return '';
            return matches.map(m => {
                const parts = m.match(/([\w]+)\(([^)]+)\)/);
                if (parts) return `${parts[1]}-${parts[2]}`;
                return m;
            }).join(', ');
        }

        function showCompletionScreen() {
            document.getElementById('englishSentence').innerHTML = '<span class="text-emerald-400">🎉 Batch Complete!</span><br><span class="text-lg text-slate-400">Please export your data.</span>';
            document.getElementById('banjaraInput').disabled = true;
            document.getElementById('notesInput').disabled = true;
            document.getElementById('recordBtn').disabled = true;
            document.getElementById('saveBtn').disabled = true;
            updateStatus('Session Complete', 'saved');
        }

        // ===== AUDIO RECORDING =====
        let audioContext, mediaStream, scriptProcessor, inputSource, audioBuffers = [];

        async function toggleRecording() {
            if (state.isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        }

        async function startRecording() {
            try {
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
                if (audioContext.state === 'suspended') await audioContext.resume();

                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                inputSource = audioContext.createMediaStreamSource(mediaStream);
                scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);

                audioBuffers = [];
                scriptProcessor.onaudioprocess = (e) => {
                    if (!state.isRecording) return;
                    audioBuffers.push(new Float32Array(e.inputBuffer.getChannelData(0)));
                };

                inputSource.connect(scriptProcessor);
                scriptProcessor.connect(audioContext.destination);

                state.isRecording = true;

                // UI Update
                const btn = document.getElementById('recordBtn');
                btn.classList.add('bg-slate-800', 'recording-pulse');
                btn.classList.remove('bg-red-600', 'hover:bg-red-500');
                document.getElementById('recordBtnText').textContent = 'Stop Recording';

                updateStatus('Recording...', 'recording');

            } catch (error) {
                console.error(error);
                alert("Microphone Error: " + error.message);
            }
        }

        function stopRecording() {
            state.isRecording = false;
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            if (inputSource) inputSource.disconnect();
            if (scriptProcessor) scriptProcessor.disconnect();

            // Export WAV
            state.currentAudioBlob = exportWAV(audioBuffers, audioContext.sampleRate);

            // UI Update
            const btn = document.getElementById('recordBtn');
            btn.classList.remove('bg-slate-800', 'recording-pulse');
            btn.classList.add('bg-red-600', 'hover:bg-red-500');
            document.getElementById('recordBtnText').textContent = 'Re-Record';

            updateStatus('Audio Captured', 'saved');
            updateUI();
        }

        function exportWAV(buffers, sampleRate) {
            const bufferLength = buffers.reduce((acc, buf) => acc + buf.length, 0);
            const pcmData = new Float32Array(bufferLength);
            let offset = 0;
            for (const buf of buffers) {
                pcmData.set(buf, offset);
                offset += buf.length;
            }
            const wavBuffer = encodeWAV(pcmData, sampleRate);
            return new Blob([wavBuffer], { type: 'audio/wav' });
        }

        function encodeWAV(samples, sampleRate) {
            const buffer = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buffer);
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + samples.length * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, samples.length * 2, true);
            floatTo16BitPCM(view, 44, samples);
            return view;
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
        }

        function floatTo16BitPCM(output, offset, input) {
            for (let i = 0; i < input.length; i++, offset += 2) {
                let s = Math.max(-1, Math.min(1, input[i]));
                s = s < 0 ? s * 0x8000 : s * 0x7FFF;
                output.setInt16(offset, s, true);
            }
        }

        function playRecording() {
            if (!state.currentAudioBlob) return;
            new Audio(URL.createObjectURL(state.currentAudioBlob)).play();
        }

        // ===== SAVING & EXPORT =====
        function saveCurrentEntry() {
            const banjaraText = document.getElementById('banjaraInput').value.trim();
            const notesText = document.getElementById('notesInput').value.trim();
            if (!banjaraText || !state.currentAudioBlob) return alert('Translation and Audio required!');

            const item = state.sentences[state.currentIndex];
            const autoNotes = state.autoNotes || '';
            const mergedNotes = [autoNotes, notesText].filter(n => n).join(', ');

            state.recordings.push({
                id: state.recordings.length + 1,
                english: item.english,
                banjara: banjaraText,
                notes: mergedNotes,
                audio: state.currentAudioBlob,
                timestamp: new Date().toISOString()
            });

            state.currentIndex++;
            loadSentence();
            updateStats();
        }

        function skipSentence() {
            if (confirm('Skip this sentence?')) {
                state.currentIndex++;
                loadSentence();
            }
        }

        async function exportData() {
            if (state.recordings.length === 0) return alert('No data to export.');
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);

            // CSV
            let csv = 'id,english,banjara,notes,audio_file,timestamp\n';
            state.recordings.forEach(e => {
                const filename = `${sanitizeFilename(e.banjara)}.wav`;
                csv += `${e.id},"${escapeCsv(e.english)}","${escapeCsv(e.banjara)}","${escapeCsv(e.notes)}",${filename},${e.timestamp}\n`;
            });
            downloadFile(csv, `banjara_translations_${timestamp}.csv`, 'text/csv');

            // Metadata CSV
            let metadata = '';
            state.recordings.forEach((e, i) => {
                metadata += `banjara_${String(e.id).padStart(5, '0')}.wav|${e.banjara}\n`;
            });
            downloadFile(metadata, `metadata_${timestamp}.csv`, 'text/plain');

            // Audio Files
            for (const e of state.recordings) {
                const filename = `${sanitizeFilename(e.banjara)}.wav`;
                downloadBlob(e.audio, filename);
                await new Promise(r => setTimeout(r, 200));
            }
        }

        function sanitizeFilename(text) { return text.replace(/[^a-z0-9]/gi, '_').toLowerCase(); }
        function escapeCsv(text) { return text.replace(/"/g, '""'); }

        function downloadFile(content, filename, mime) {
            downloadBlob(new Blob([content], { type: mime }), filename);
        }
        function downloadBlob(blob, filename) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // ===== HELPERS =====
        function updateUI() {
            const hasText = document.getElementById('banjaraInput').value.trim().length > 0;
            const hasAudio = !!state.currentAudioBlob;
            document.getElementById('saveBtn').disabled = !(hasText && hasAudio);
            document.getElementById('playbackBtn').disabled = !hasAudio;
        }

        function updateProgress() {
            const total = state.sentences.length;
            const completed = state.currentIndex;
            const percent = total ? (completed / total) * 100 : 0;
            document.getElementById('progressBar').style.width = `${percent}%`;
            document.getElementById('progressText').textContent = `${completed}/${total}`;
        }

        function updateStats() {
            // No-op for now unless stats UI added
        }

        function updateStatus(msg, type) {
            const banner = document.getElementById('statusBanner');
            banner.textContent = msg;
            if (type === 'recording') banner.classList.add('text-red-400', 'animate-pulse');
            else banner.classList.remove('text-red-400', 'animate-pulse');
        }

        function startSessionTimer() {
            // simplified
        }

        // ===== EVENTS =====
        document.getElementById('recordBtn').addEventListener('click', toggleRecording);
        document.getElementById('saveBtn').addEventListener('click', saveCurrentEntry);
        document.getElementById('skipBtn').addEventListener('click', skipSentence);
        document.getElementById('playbackBtn').addEventListener('click', playRecording);
        document.getElementById('exportBtn').addEventListener('click', exportData);
        document.getElementById('banjaraInput').addEventListener('input', updateUI);

        // Init
        window.addEventListener('DOMContentLoaded', initialize);
    </script>
